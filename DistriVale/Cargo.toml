[package]
name = "DistriVale"
version = "0.9.7"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
# Native "Save As" dialog for the download-location prompt in main.rs's
# on_download handler — lighter than pulling in the full tauri-plugin-dialog
# (which exists for JS-invokable commands; we only need it from Rust).
rfd = "0.15"
