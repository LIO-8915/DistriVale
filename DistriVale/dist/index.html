<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>DistriVale</title>
<style>
    /* Disney+/Netflix-style title card: dark vignette tinted to the brand's
       own blue, and a mark with no filled plate behind it — just the glyph,
       fading/scaling in once and settling into a slow ambient glow pulse.
       Mirrors DistriValeWeb's own #dv-preloader (see layouts/app.blade.php)
       so the two hand off to each other without a visual jump: this page is
       shown first while main.rs boots php artisan serve, then main.rs
       navigates the window straight to the Laravel app, which shows its own
       matching splash for the brief moment its own assets settle. */
    /* A CSS radial-gradient() here shows a visible vertical seam in
       WebView2/Chromium — a real rasterization artifact of that gradient
       type, confirmed in the actual packaged app (not a test-only fluke,
       and not fixed by making the stops opaque). Built the same soft
       vignette a different way: solid background + a large, heavily
       blurred circle (filter: blur(), not a gradient) as the glow — see
       app.blade.php's #dv-preloader for the matching fix. */
    html, body {
        height: 100%; margin: 0;
        background: #03040a;
        font-family: 'Segoe UI', ui-sans-serif, system-ui, sans-serif;
        display: flex; align-items: center; justify-content: center;
        overflow: hidden;
    }
    body::before {
        content: ""; position: fixed; top: 42%; left: 50%; transform: translate(-50%, -50%);
        width: min(70vmax, 900px); height: min(70vmax, 900px);
        background: #3558a4; border-radius: 50%; filter: blur(140px); opacity: .65;
    }
    .dv-splash { text-align: center; position: relative; z-index: 1; }
    /* "Sol naciente": sube rápido desde abajo, decelerando al acercarse al
       centro, se pasa de largo hacia arriba, cae con un solo rebote y se
       fija en el centro — mientras se asienta, crece un poco de tamaño,
       pero ese crecimiento es gradual (se completa junto con el rebote),
       no un salto de tamaño inmediato. Los porcentajes del keyframe (no un
       solo cubic-bezier) son los que dibujan la deceleración/rebote; la
       función linear de abajo deja esa forma intacta en vez de sumarle
       otra curva encima. La animación va en este contenedor liso, no en la
       imagen del círculo (ver el comentario junto a .dv-splash-badge). */
    .dv-splash-icon-wrap {
        position: relative; width: 168px; height: 168px; margin: 0 auto 1.15rem;
        animation: dv-splash-sunrise 1.1s linear both;
    }
    /* Mismo distintivo que el resto de la app (ícono del sidebar, ícono de
       la app de Windows): círculo con el degradado de marca y el logo
       blanco encima. Iba como dos <div> con border-radius+background
       dibujado por CSS, pero WebView2 recortaba mal ese círculo (arriba
       plano, abajo redondo) sin importar cómo se separara el centrado del
       recorte. La imagen ya trae el círculo horneado en los píxeles (ver
       composite_badge.html) — así no hay ningún border-radius que el
       motor tenga que calcular mal, y drop-shadow (sigue la forma real del
       alfa) reemplaza al box-shadow (seguía el cuadro, no el círculo). */
    .dv-splash-badge {
        width: 100%; height: 100%;
        filter: drop-shadow(0 10px 20px rgba(79, 124, 255, .45));
    }
    .dv-splash-text {
        color: #fff; font-weight: 600; font-size: 1rem; letter-spacing: .16em;
        text-transform: uppercase; opacity: 0;
        animation: dv-splash-text-in .6s ease-out .75s forwards;
    }
    @keyframes dv-splash-sunrise {
        0%   { opacity: 0; transform: translateY(52px) scale(.85); }
        6%   { opacity: 1; }
        22%  { transform: translateY(6px) scale(.97); }
        40%  { transform: translateY(-6px) scale(1); }
        58%  { transform: translateY(-11px) scale(1); }
        76%  { transform: translateY(4px) scale(1.02); }
        90%  { transform: translateY(-1px) scale(1.06); }
        100% { transform: translateY(0) scale(1.08); }
    }
    @keyframes dv-splash-text-in { from { opacity: 0; transform: translateY(8px); } to { opacity: .92; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) {
        .dv-splash-icon-wrap { animation: dv-splash-in-reduced .3s ease both; }
    }
    @keyframes dv-splash-in-reduced { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: scale(1); } }
</style>
</head>
<body>
    <div class="dv-splash">
        <div class="dv-splash-icon-wrap">
            <img class="dv-splash-badge" src="images/logo-distrivale-badge.png" alt="" aria-hidden="true">
        </div>
        <div class="dv-splash-text">DistriVale</div>
    </div>
</body>
</html>
