<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>DistriVale</title>
<style>
    html, body {
        height: 100%; margin: 0;
        background: #0c4660;
        font-family: 'Segoe UI', ui-sans-serif, system-ui, sans-serif;
        display: flex; align-items: center; justify-content: center;
    }
    .dv-loading { text-align: center; color: #fff; }
    .dv-loading .brand {
        width: 56px; height: 56px; border-radius: 16px; margin: 0 auto 1.1rem;
        background: linear-gradient(135deg, #4f7cff, #7aa2ff);
        box-shadow: 0 8px 24px rgba(79, 124, 255, .45);
    }
    .dv-loading h1 { font-size: 1.15rem; font-weight: 600; margin: 0 0 .35rem; }
    .dv-loading p { font-size: .85rem; color: #aab4c6; margin: 0; }
    .dv-spinner {
        width: 26px; height: 26px; margin: 1.25rem auto 0;
        border: 3px solid rgba(255, 255, 255, .2); border-top-color: #7aa2ff;
        border-radius: 50%; animation: dv-spin 0.8s linear infinite;
    }
    @keyframes dv-spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
    <div class="dv-loading">
        <div class="brand"></div>
        <h1>DistriVale</h1>
        <p>Iniciando el sistema…</p>
        <div class="dv-spinner"></div>
    </div>
</body>
</html>
