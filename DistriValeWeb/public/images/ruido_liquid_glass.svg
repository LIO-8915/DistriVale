<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <filter id="liquidNoise">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.018 0.032"
        numOctaves="4"
        seed="23"
        stitchTiles="stitch"
        result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncR type="table" tableValues="0.20 0.80"/>
        <feFuncG type="table" tableValues="0.20 0.80"/>
        <feFuncB type="table" tableValues="0.20 0.80"/>
        <feFuncA type="table" tableValues="0.25 0.75"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="#7CB7C8" filter="url(#liquidNoise)"/>
</svg>
